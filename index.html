<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Галерея котиков</title>
    <script src="gallery.js" defer></script>
    <style>
        :root {
            --bg: #c58af2;
            --card: #d8a7fd;
            --text: #6927cb;
            --muted: #ffffff;
            --border: #a148e8;
            --accent: #c47ff9;
            --accent-hover: #9aa0ff;
            --header-text: #6927cb;
            --per-view: 3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px;
            background: var(--bg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 980px;
            padding: 32px 24px 24px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(107, 33, 168, 0.4); 
            
            max-height: 90vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card h2 {
            margin: 0 0 6px;
            font-size: 26px;
            text-align: center;
            color: var(--header-text);
        }
        .lead {
            margin: 0 0 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .slider {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .viewport {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            border-radius: 12px;
        }
        .track {
            display: flex;
            margin: 0;
            padding: 0;
            list-style: none;
            transition: transform 0.45s ease;
        }
        .slide {
            flex: 0 0 calc(100% / var(--per-view));
            padding: 0 6px;
        }
        
        .slide img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            user-select: none;
            -webkit-user-drag: none;
        }

        .arrow {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            padding: 0;
            cursor: pointer;
            color: #ffffff;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .arrow:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 6px 16px rgba(124, 131, 255, 0.45);
        }

        .arrow:focus-visible, .dot:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }
        .arrow svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pager {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .dots {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .dot {
            width: 14px;
            height: 14px;
            padding: 0;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.4); 
            border: none;
            border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
        }
        .dot.active {
            background: #ffffff;
            transform: scale(1.25);
        }
        .pager-text {
            margin: 10px 0 0;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .main-footer {
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            width: 100%;
        }
        .main-footer p {
            margin: 0;
        }

        @media (max-width: 600px) {
            :root {
                --per-view: 1;
            }
            .card {
                padding: 24px 12px 20px;
            }
            .slider {
                gap: 6px;
            }
            .arrow {
                width: 38px;
                height: 38px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <h2>Галерея котиков</h2>
        <p class="lead">Листайте стрелками, точками под галереей или свайпом.</p>

        <section id="gallery" class="slider" aria-roledescription="карусель" aria-label="Галерея товаров">
            <button type="button" class="arrow" id="prev" aria-label="Назад">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"></path></svg>
            </button>

            <div class="viewport" id="viewport">
                <div class="track" id="track">
                    <div class="slide"><img src="images/1.jpg" alt="Изображение 1"></div>
                    <div class="slide"><img src="images/2.jpg" alt="Изображение 2"></div>
                    <div class="slide"><img src="images/3.jpg" alt="Изображение 3"></div>
                    <div class="slide"><img src="images/4.jpg" alt="Изображение 4"></div>
                    <div class="slide"><img src="images/5.jpg" alt="Изображение 5"></div>
                    <div class="slide"><img src="images/6.jpg" alt="Изображение 6"></div>
                    <div class="slide"><img src="images/7.jpg" alt="Изображение 7"></div>
                    <div class="slide"><img src="images/8.jpg" alt="Изображение 8"></div>
                </div>
            </div>

            <button type="button" class="arrow" id="next" aria-label="Вперёд">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"></path></svg>
            </button>
        </section>

        <nav class="pager" aria-label="Страницы галереи">
            <div class="dots" id="dots"></div>
            <p class="pager-text" id="pager-text" aria-live="polite"></p>
        </nav>
    </main>

    <footer class="main-footer">
        <p>© Авдошина Мария</p>
    </footer>

</body>
</html>
